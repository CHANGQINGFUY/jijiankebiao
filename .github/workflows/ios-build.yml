# 极简课表 iOS 构建（未签名 IPA）
# 在 GitHub 云上 macOS runner 构建，产物可直接下载安装到真机。

name: iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - ios/**
      - lib/**
      - pubspec.yaml
      - pubspec.lock
      - '!**/*.md'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Xcode version + available platforms
        run: |
          xcodebuild -version
          echo "=== Platforms ==="
          ls /Applications/Xcode_16.app/Contents/Developer/Platforms/ 2>/dev/null
          echo "=== iOS SDKs ==="
          ls /Applications/Xcode_16.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/ 2>/dev/null || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter dependencies
        run: flutter pub get

      - name: Setup CocoaPods
        run: |
          brew install cocoapods 2>/dev/null || brew upgrade cocoapods || true
          pod --version

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          rm -rf Pods Podfile.lock
          pod install --repo-update

      - name: Fix xcconfig include for Pods
        working-directory: ios
        run: |
          echo '#include "Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"' > /tmp/debug_new.xcconfig
          cat Flutter/Debug.xcconfig >> /tmp/debug_new.xcconfig
          mv /tmp/debug_new.xcconfig Flutter/Debug.xcconfig
          echo '#include "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"' > /tmp/release_new.xcconfig
          cat Flutter/Release.xcconfig >> /tmp/release_new.xcconfig
          mv /tmp/release_new.xcconfig Flutter/Release.xcconfig

      - name: Build with xcodebuild (auto-detect everything)
        working-directory: ios
        run: |
          echo "=== Destinations ==="
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -showdestinations 2>&1 | head -20
          echo "=== Build ==="
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            build
          echo "EXIT=$?"

      - name: Find and package IPA
        run: |
          echo "=== Searching for Runner.app ==="
          find ios/build -name "Runner.app" -type d 2>/dev/null
          # Also check default DerivedData
          find ~/Library/Developer/Xcode/DerivedData -path "*/Release-iphoneos/Runner.app" -type d 2>/dev/null | head -3
          APP_PATH=$(find ios/build -path "*/Release-iphoneos/Runner.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Release-iphoneos/Runner.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ No Runner.app found"
            exit 1
          fi
          echo "✅ Found: $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          cd "$APP_DIR"
          rm -rf Payload app-unsigned.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa
          pwd

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ios
          path: |
            ios/build/**/app-unsigned.ipa
            ~/Library/Developer/Xcode/DerivedData/**/app-unsigned.ipa
          retention-days: 30
