# 极简课表 iOS 构建（未签名 IPA）
# 在 GitHub 云上 macOS runner 构建，产物可直接下载安装到真机。

name: iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - ios/**
      - lib/**
      - pubspec.yaml
      - pubspec.lock
      - '!**/*.md'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Xcode version
        run: xcodebuild -version

      - name: Install iOS 18 simulator runtime
        run: |
          sudo xcodebuild -downloadPlatform iOS 2>&1 || true
          xcrun simctl runtime list 2>/dev/null | head -10

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter dependencies
        run: flutter pub get

      - name: Force Flutter to set up SPM + Pods (debug build triggers all integration)
        run: flutter build ios --debug --no-codesign --build-number=1 2>&1 | tail -30 || echo "debug build had issues but SPM should be set up"

      - name: Show workspace state after flutter build
        working-directory: ios
        run: |
          echo "=== Pods ==="
          ls Pods/ 2>/dev/null | head -10
          echo "=== Flutter/ephemeral ==="
          ls Flutter/ephemeral/ 2>/dev/null | head -10
          echo "=== xcworkspace contents ==="
          cat Runner.xcworkspace/contents.xcworkspacedata 2>/dev/null
          echo "=== Swift Packages ==="
          find . -name "*.swiftpackage" -o -name "Package.resolved" 2>/dev/null | head -10

      - name: Add dummy DEVELOPMENT_TEAM
        run: |
          P="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = ABCDE12345;/g' "$P"
          echo "=== Check pbxproj after sed ==="
          grep -c "DEVELOPMENT_TEAM" "$P" || echo "0 matches"

      - name: Final xcodebuild Release build (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tail -50
          echo "EXIT=$?"

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find ios/build -path "*/Release-iphoneos/Runner.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No Runner.app"
            exit 1
          fi
          echo "✅ $APP_PATH"
          cd "$(dirname $APP_PATH)"
          rm -rf Payload app-unsigned.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ios
          path: ios/build/Release-iphoneos/app-unsigned.ipa
          retention-days: 30
