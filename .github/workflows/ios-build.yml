# 极简课表 iOS 构建（未签名 IPA）
# 在 GitHub 云上 macOS runner 构建，产物可直接下载安装到真机。

name: iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - ios/**
      - lib/**
      - pubspec.yaml
      - pubspec.lock
      - '!**/*.md'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Xcode version
        run: xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter dependencies
        run: flutter pub get

      - name: Patch Xcode project for unsigned build
        run: |
          P="ios/Runner.xcodeproj/project.pbxproj"
          echo "Patching $P..."
          # Remove DEVELOPMENT_TEAM references entirely
          sed -i '' '/DEVELOPMENT_TEAM/d' "$P"
          # Set CODE_SIGN_STYLE to Manual everywhere
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$P"
          # Disable code signing
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' "$P"
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' "$P"
          # Add CODE_SIGNING_ALLOWED = NO after CODE_SIGN_STYLE = Manual lines that don't have it
          grep -n "CODE_SIGN_STYLE = Manual" "$P"
          echo "Patch done."

      - name: Setup CocoaPods
        run: |
          brew install cocoapods 2>/dev/null || brew upgrade cocoapods || true
          pod --version

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        working-directory: build/ios/iphoneos
        run: |
          rm -rf Payload app-unsigned.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ios
          path: build/ios/iphoneos/app-unsigned.ipa
          retention-days: 30
