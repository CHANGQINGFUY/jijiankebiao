# 极简课表 iOS 构建（未签名 IPA）
# 在 GitHub 云上 macOS runner 构建，产物可直接下载安装到真机。

name: iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - ios/**
      - lib/**
      - pubspec.yaml
      - pubspec.lock
      - '!**/*.md'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Xcode version
        run: xcodebuild -version

      - name: Install iOS 18 simulator runtime
        run: |
          sudo xcodebuild -downloadPlatform iOS 2>&1 || true
          xcrun simctl runtime list 2>/dev/null | head -10

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter dependencies
        run: flutter pub get

      - name: Setup CocoaPods
        run: |
          brew install cocoapods 2>/dev/null || brew upgrade cocoapods || true
          pod --version

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          rm -rf Pods Podfile.lock
          pod install --repo-update

      - name: Fix xcconfig include for Pods
        working-directory: ios
        run: |
          echo '#include "Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"' > /tmp/debug_new.xcconfig
          cat Flutter/Debug.xcconfig >> /tmp/debug_new.xcconfig
          mv /tmp/debug_new.xcconfig Flutter/Debug.xcconfig
          
          echo '#include "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"' > /tmp/release_new.xcconfig
          cat Flutter/Release.xcconfig >> /tmp/release_new.xcconfig
          mv /tmp/release_new.xcconfig Flutter/Release.xcconfig
          
          echo "=== Final xcconfigs ==="
          cat Flutter/Debug.xcconfig
          echo "---"
          cat Flutter/Release.xcconfig

      - name: Add dummy DEVELOPMENT_TEAM to bypass Flutter check
        run: |
          P="ios/Runner.xcodeproj/project.pbxproj"
          # Replace CODE_SIGN_STYLE = Automatic with Manual + dummy TEAM
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = ABCDE12345;/g' "$P"
          echo "=== CODE_SIGN lines ==="
          grep -n "CODE_SIGN\|DEVELOPMENT_TEAM" "$P" | head -20

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        working-directory: build/ios/iphoneos
        run: |
          rm -rf Payload app-unsigned.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ios
          path: build/ios/iphoneos/app-unsigned.ipa
          retention-days: 30
