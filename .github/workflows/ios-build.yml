# 极简课表 iOS 构建（未签名 IPA）
# 在 GitHub 云上 macOS runner 构建，产物可直接下载安装到真机。

name: iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - ios/**
      - lib/**
      - pubspec.yaml
      - pubspec.lock
      - '!**/*.md'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Xcode version
        run: xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter dependencies
        run: flutter pub get

      - name: Setup CocoaPods
        run: |
          brew install cocoapods 2>/dev/null || brew upgrade cocoapods || true
          pod --version

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          rm -rf Pods Podfile.lock
          pod install --repo-update --verbose

      - name: Debug Pods state
        working-directory: ios
        run: |
          echo "=== Pods dir ==="
          ls -la Pods/ 2>/dev/null | head -10
          echo "=== Pods xcconfig ==="
          cat "Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig" 2>/dev/null
          echo "=== Runner Debug.xcconfig ==="
          cat Flutter/Debug.xcconfig
          echo "=== workspace exists ==="
          ls -la Runner.xcworkspace/ 2>/dev/null

      - name: Build unsigned IPA via xcodebuild
        working-directory: ios
        run: |
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            build 2>&1 | tee /tmp/xcodebuild.log
          echo "EXIT_CODE=$?"
          echo "=== Last 30 lines of xcodebuild log ==="
          tail -30 /tmp/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          IOS_PATH="$(pwd)/ios"
          echo "Searching for Runner.app under $IOS_PATH/build..."
          find "$IOS_PATH/build" -name "Runner.app" -type d
          APP_PATH=$(find "$IOS_PATH/build" -path "*/Release-iphoneos/Runner.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No Runner.app found in build output"
            exit 1
          fi
          echo "✅ Found: $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          cd "$APP_DIR"
          rm -rf Payload app-unsigned.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ios
          path: |
            ios/build/Release-iphoneos/app-unsigned.ipa
            ios/build/Build/Products/Release-iphoneos/app-unsigned.ipa
          retention-days: 30
