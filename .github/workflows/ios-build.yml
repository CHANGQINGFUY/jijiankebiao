# 极简课表 iOS 构建（未签名 IPA）
# 在 GitHub 云上 macOS runner 构建，产物可直接下载安装到真机。

name: iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - ios/**
      - lib/**
      - pubspec.yaml
      - pubspec.lock
      - '!**/*.md'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Xcode version
        run: xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter dependencies
        run: flutter pub get

      - name: Setup CocoaPods
        run: |
          brew install cocoapods 2>/dev/null || brew upgrade cocoapods || true
          pod --version
          pod setup 2>/dev/null || true

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build unsigned IPA via xcodebuild
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/ios/Build/Products/Release-iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Runner.app not found at $APP_PATH"
            echo "Available products:"
            find build/ios/Build -name "*.app" 2>/dev/null || echo "no .app found"
            exit 1
          fi
          cd build/ios/Build/Products/Release-iphoneos
          rm -rf Payload app-unsigned.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa
          pwd

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ios
          path: build/ios/Build/Products/Release-iphoneos/app-unsigned.ipa
          retention-days: 30
