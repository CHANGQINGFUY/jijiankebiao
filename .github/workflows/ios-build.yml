# 极简课表 iOS 构建（未签名 IPA）
# 在 GitHub 云上 macOS runner 构建，产物可直接下载安装到真机。

name: iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - ios/**
      - lib/**
      - pubspec.yaml
      - pubspec.lock
      - '!**/*.md'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Xcode version
        run: xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: |
          flutter pub get
          flutter clean

      - name: Flutter build to set up SPM (Team check will fail but SPM is configured)
        run: flutter build ios --debug --no-codesign 2>&1 | tail -30 || echo "flutter build failed, checking workspace state..."

      - name: Check workspace state after flutter build
        working-directory: ios
        run: |
          echo "=== xcworkspace ==="
          cat Runner.xcworkspace/contents.xcworkspacedata 2>/dev/null
          echo "=== Package.resolved ==="
          find . -name "Package.resolved" -exec echo "Found: {}" \;
          echo "=== Swift packages in pbxproj ==="
          grep -c "XCRemoteSwiftPackageReference" Runner.xcodeproj/project.pbxproj 2>/dev/null || echo "0"

      - name: xcodebuild Release iOS (unsigned, skip code signing)
        working-directory: ios
        run: |
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            build
          echo "EXIT=$?"

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find ios/build -path "*/Release-iphoneos/Runner.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Release-iphoneos/Runner.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "❌ No Runner.app"
            exit 1
          fi
          echo "✅ $APP_PATH"
          cd "$(dirname $APP_PATH)"
          rm -rf Payload app-unsigned.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ios
          path: |
            ios/build/**/app-unsigned.ipa
            ~/Library/Developer/Xcode/DerivedData/**/app-unsigned.ipa
          retention-days: 30
