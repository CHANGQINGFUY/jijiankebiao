name: Web Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Flutter web and publish to gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: web
        run: flutter pub get

      - name: Build web (release)
        working-directory: web
        run: flutter build web --release --base-href /jijiankebiao/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: web build'